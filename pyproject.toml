[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hetzcosta-job_preemption_fairness_count_trace"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出AI 芯片算子优化工程师·作业抢占与调度公平性上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hetzcosta" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://hetzcosta.github.io"
Repository = "https://github.com/hetzcosta/job_preemption_fairness_count_trace"
Issues = "https://github.com/hetzcosta/job_preemption_fairness_count_trace/issues"

[project.scripts]
job_preemption_fairness_count_trace = "job_preemption_fairness_count_trace:main"

[tool.setuptools]
py-modules = ["job_preemption_fairness_count_trace"]
